<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#153d70">
  <title>이채현 | 덕천중학교</title>
  <meta name="description" content="이채현 교사 디지털 명함">
  <style>
    :root {
      --navy:#153d70;
      --navy2:#0d2f59;
      --sky:#87c6ff;
      --pink:#ff9cab;
      --cream:#fff4cf;
      --text:#17314f;
      --bg:#f5f8fc;
      --card:#ffffff;
      --shadow:0 16px 45px rgba(13,47,89,.16);
    }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body {
      margin:0;
      min-height:100vh;
      font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 8% 10%, rgba(255,156,171,.22), transparent 28%),
        radial-gradient(circle at 90% 18%, rgba(135,198,255,.28), transparent 30%),
        linear-gradient(180deg,#eef5ff 0%,var(--bg) 52%,#fff 100%);
    }
    .wrap {
      width:min(680px, 100%);
      margin:0 auto;
      padding:24px 18px 44px;
    }
    .hero {
      position:relative;
      overflow:hidden;
      background:linear-gradient(145deg,var(--navy),var(--navy2));
      color:white;
      border-radius:28px;
      padding:28px 22px 24px;
      box-shadow:var(--shadow);
    }
    .hero:before,.hero:after {
      content:"";
      position:absolute;
      border:7px solid rgba(135,198,255,.9);
      border-radius:50%;
      width:130px;height:130px;
      right:-56px;top:-70px;
    }
    .hero:after {
      width:110px;height:110px;
      left:-60px;top:auto;bottom:-60px;
      border-color:rgba(255,156,171,.9);
    }
    .kicker {
      display:inline-flex;
      align-items:center;
      gap:8px;
      font-size:13px;
      font-weight:800;
      letter-spacing:.02em;
      background:rgba(255,255,255,.12);
      border:1px solid rgba(255,255,255,.18);
      padding:8px 12px;
      border-radius:999px;
    }
    h1 {
      margin:18px 0 6px;
      font-size:34px;
      letter-spacing:-.04em;
    }
    .sub {
      margin:0;
      opacity:.92;
      font-size:16px;
      font-weight:650;
    }
    .desc {
      margin:12px 0 0;
      color:#eaf4ff;
      font-size:14px;
      line-height:1.6;
    }
    .panel {
      margin-top:18px;
      background:rgba(255,255,255,.96);
      border:1px solid rgba(21,61,112,.08);
      border-radius:24px;
      padding:16px;
      box-shadow:0 10px 28px rgba(13,47,89,.09);
    }
    .preview {
      width:100%;
      display:block;
      border-radius:18px;
      box-shadow:0 8px 20px rgba(13,47,89,.13);
    }
    .actions {
      display:grid;
      grid-template-columns:1fr;
      gap:11px;
      margin-top:14px;
    }
    .btn {
      display:flex;
      align-items:center;
      justify-content:center;
      gap:9px;
      width:100%;
      min-height:54px;
      border-radius:16px;
      text-decoration:none;
      font-weight:800;
      font-size:16px;
      transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;
      -webkit-tap-highlight-color:transparent;
    }
    .btn:active { transform:scale(.985); }
    .primary {
      background:var(--navy);
      color:white;
      box-shadow:0 8px 18px rgba(21,61,112,.24);
    }
    .secondary {
      background:#eef5ff;
      color:var(--navy);
      border:1px solid #d6e7fb;
    }
    .download {
      background:var(--cream);
      color:#5a4711;
      border:1px solid #f0df9c;
    }
    .grid2 {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:11px;
    }
    .meta {
      margin:16px 4px 2px;
      text-align:center;
      font-size:12px;
      line-height:1.55;
      color:#6f7f91;
    }
    @media (max-width:420px) {
      .grid2 { grid-template-columns:1fr; }
      h1 { font-size:31px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <div class="kicker">✨ DIGITAL BUSINESS CARD</div>
      <h1>이채현</h1>
      <p class="sub">덕천중학교 · 교사</p>
      <p class="desc">AI 기반 교과 교관 (기계교육/기술 가정교육)</p>
    </section>

    <section class="panel">
      <img class="preview" src="card.png" alt="이채현 명함 이미지">

      <div class="actions">
        <a class="btn primary" href="contact.vcf" download="이채현_연락처.vcf">📇 연락처 저장</a>

        <div class="grid2">
          <a class="btn secondary" href="tel:+821093635725">📞 전화하기</a>
          <a class="btn secondary" href="mailto:leechaehyun@snu.ac.kr">✉️ 이메일</a>
        </div>

        <a class="btn download" href="card.png" download="이채현_명함.png">⬇️ 명함 이미지 다운로드</a>
      </div>

      <p class="meta">
        휴대폰 환경에 따라 연락처 저장 또는 이미지 다운로드 전에<br>
        확인 화면이 한 번 표시될 수 있습니다.
      </p>
    </section>
  </main>
</body>
</html>
