<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이채현 — 기술교사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+KR:wght@400;500;700;900&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#16283D; --navy-deep:#0E1B29; --blue-line:#3E6089; --blue-line-soft:rgba(62,96,137,0.35);
    --paper:#F3EFE3; --paper-dim:#E9E3D2; --copper:#C4854B; --copper-bright:#DDA36C;
    --chalk:#EDEAE0; --graphite:#282622;
    --serif:'Noto Serif KR', serif; --sans:'Noto Sans KR', sans-serif;
    --mono:'JetBrains Mono', monospace; --grotesk:'Space Grotesk', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{background:var(--navy); color:var(--chalk); font-family:var(--sans); overflow-x:hidden; -webkit-font-smoothing:antialiased;}
  ::selection{background:var(--copper); color:var(--navy-deep);}
  .grid-bg{position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:linear-gradient(var(--blue-line-soft) 1px, transparent 1px), linear-gradient(90deg, var(--blue-line-soft) 1px, transparent 1px);
    background-size:44px 44px; opacity:0.28;}
  section, main, footer{position:relative; z-index:1;}
  .crosshair{position:absolute; width:20px; height:20px; opacity:0.5;}
  .crosshair::before,.crosshair::after{content:""; position:absolute; background:var(--copper);}
  .crosshair::before{top:50%; left:0; width:100%; height:1px; transform:translateY(-50%);}
  .crosshair::after{left:50%; top:0; height:100%; width:1px; transform:translateX(-50%);}
  .crosshair.tl{top:20px; left:16px;} .crosshair.tr{top:20px; right:16px;}
  .crosshair.bl{bottom:20px; left:16px;} .crosshair.br{bottom:20px; right:16px;}
  .wrap{max-width:1040px; margin:0 auto; padding:0 32px;}
  .eyebrow{font-family:var(--mono); font-size:12px; letter-spacing:0.2em; text-transform:uppercase; color:var(--copper-bright); display:flex; align-items:center; gap:12px; margin-bottom:26px;}
  .eyebrow::before{content:""; width:26px; height:1px; background:var(--copper-bright);}
  .hero{min-height:92vh; display:flex; flex-direction:column; justify-content:center; padding:100px 0 60px;}
  .hero-inner{position:relative; border:1px solid var(--blue-line-soft); padding:48px 36px;}
  .hero-flex{display:flex; flex-direction:column-reverse; gap:36px; align-items:center;}
  .hero-text{flex:1 1 480px; min-width:0; width:100%;}
  .hero-robot-col{flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:10px;}
  .robot-panel-label{font-family:var(--mono); font-size:10px; letter-spacing:0.16em; color:var(--blue-line); text-transform:uppercase;}
  @media (min-width:860px){ .hero-flex{flex-direction:row; align-items:flex-end; justify-content:space-between;} }
  h1{font-family:var(--serif); font-weight:900; font-size:clamp(48px,10vw,108px); line-height:0.95; letter-spacing:-0.02em; color:var(--paper);}
  .role-text{font-family:var(--serif); font-weight:500; font-size:clamp(18px,2.6vw,24px); color:var(--copper-bright); margin-top:16px;}
  .lede{font-family:var(--sans); font-weight:300; font-size:clamp(15px,1.8vw,18px); line-height:1.8; color:var(--chalk); max-width:560px; margin-top:24px; opacity:0.88;}
  .title-block{margin-top:44px; width:100%; max-width:480px; border:1px solid var(--blue-line); font-family:var(--mono); font-size:12px;}
  .tb-row{display:flex; border-top:1px solid var(--blue-line);}
  .tb-row:first-child{border-top:none;}
  .tb-cell{padding:10px 14px; flex:1; border-left:1px solid var(--blue-line);}
  .tb-cell:first-child{border-left:none;}
  .tb-label{color:var(--copper-bright); letter-spacing:0.08em; font-size:10px; margin-bottom:4px; text-transform:uppercase;}
  .tb-value{color:var(--paper); font-family:var(--grotesk); font-size:13px;}

  /* Robot */
  .robot-stage{display:flex; flex-direction:column; align-items:center; gap:14px;}
  .robot-wrap{width:190px; height:190px;}
  .speech-bubble{position:relative; background:var(--paper); color:var(--graphite); font-family:var(--mono); font-size:12.5px; padding:10px 16px; border:1px solid var(--blue-line); white-space:nowrap;}
  .speech-bubble::before{content:""; position:absolute; top:-7px; left:50%; transform:translateX(-50%) rotate(45deg); width:12px; height:12px; background:var(--paper); border-left:1px solid var(--blue-line); border-top:1px solid var(--blue-line);}
  #robotGroup{transition:transform 0.18s ease-out;}

  /* Reveal */
  .reveal{opacity:0; transform:translateY(24px); transition:opacity 0.8s ease, transform 0.8s ease;}
  .reveal.in{opacity:1; transform:translateY(0);}

  .section{padding:80px 0;}
  .section-head{display:flex; align-items:baseline; gap:18px; margin-bottom:40px; flex-wrap:wrap;}
  .section-num{font-family:var(--mono); font-size:12px; color:var(--blue-line); letter-spacing:0.1em;}
  .section-title{font-family:var(--serif); font-weight:700; font-size:clamp(24px,3.4vw,36px); color:var(--paper);}
  .intro-body{font-family:var(--sans); font-weight:300; font-size:16.5px; line-height:1.9; color:var(--chalk); max-width:640px; opacity:0.92;}

  .timeline{display:flex; flex-direction:column; border-top:1px solid var(--blue-line-soft);}
  .timeline-row{display:flex; align-items:baseline; gap:20px; padding:18px 0; border-bottom:1px solid var(--blue-line-soft); flex-wrap:wrap;}
  .timeline-period{font-family:var(--mono); font-size:12.5px; color:var(--copper-bright); min-width:130px;}
  .timeline-divider{width:24px; height:1px; background:var(--blue-line); margin-top:6px; flex-shrink:0;}
  .timeline-title{font-family:var(--sans); font-size:15.5px; line-height:1.6; color:var(--paper);}
  .timeline-title.accent{color:var(--copper-bright);}

  .manuscript{background:var(--paper); color:var(--graphite); border:1px solid var(--blue-line); padding:44px 40px;}
  .m-kicker{font-family:var(--mono); font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:var(--blue-line); margin-bottom:14px;}
  .m-title{font-family:var(--serif); font-weight:700; font-size:clamp(20px,2.8vw,28px); line-height:1.35; max-width:560px;}
  .m-desc{font-family:var(--sans); font-size:15px; line-height:1.9; color:#4a463d; max-width:600px; margin-top:18px;}
  .callout-row{display:flex; gap:12px; align-items:flex-start; margin-bottom:12px; margin-top:12px;}
  .callout-dot{flex-shrink:0; width:7px; height:7px; border-radius:50%; background:var(--copper); margin-top:7px;}
  .callout-txt{font-family:var(--sans); font-size:14px; line-height:1.7; color:#4a463d;}

  .legend-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:26px; margin-top:30px;}
  .legend-item{border-top:1px solid var(--blue-line-soft); padding-top:14px;}
  .legend-num{font-family:var(--mono); font-size:11px; color:var(--copper-bright); letter-spacing:0.1em;}
  .legend-item h4{font-family:var(--serif); font-weight:600; font-size:16.5px; color:var(--paper); margin:8px 0 6px;}
  .legend-item p{font-family:var(--sans); font-weight:300; font-size:13.5px; line-height:1.7; color:var(--chalk); opacity:0.85;}

  .help-toggle{margin-top:16px; background:transparent; border:1px solid var(--blue-line); color:var(--copper-bright); font-family:var(--mono); font-size:11.5px; padding:8px 14px; cursor:pointer;}
  .help-text{font-family:var(--sans); font-size:13.5px; line-height:1.8; color:var(--chalk); opacity:0.85; margin-top:12px; max-width:560px; display:none;}
  .qr-row{display:flex; gap:10px; margin-top:24px; flex-wrap:wrap;}
  .qr-input{flex:1; min-width:220px; background:transparent; border:1px solid var(--blue-line); color:var(--paper); padding:10px 14px; font-family:var(--mono); font-size:12.5px;}
  .qr-save-btn, .save-btn, .edit-fab, .qr-save-btn{background:var(--copper); color:var(--navy-deep); border:none; padding:10px 18px; font-family:var(--mono); font-size:12px; letter-spacing:0.05em; cursor:pointer;}
  .qr-box{margin-top:28px; display:flex; flex-direction:column; align-items:flex-start; gap:10px; background:var(--paper); padding:20px; border:1px solid var(--blue-line); max-width:300px;}
  .qr-box img{width:220px; height:220px;}
  .qr-caption{font-family:var(--mono); font-size:10.5px; color:var(--graphite); opacity:0.7;}
  .qr-placeholder{margin-top:24px; border:1px dashed var(--blue-line-soft); padding:30px; font-family:var(--mono); font-size:12px; color:var(--chalk); opacity:0.5; max-width:300px;}

  footer{padding:56px 0 44px; border-top:1px solid var(--blue-line-soft); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px;}
  .footer-who{font-family:var(--serif); font-weight:700; font-size:17px; color:var(--paper);}
  .footer-meta{font-family:var(--mono); font-size:11px; color:var(--blue-line); letter-spacing:0.05em;}

  .edit-fab{position:fixed; top:20px; right:20px; z-index:20; background:var(--navy-deep); color:var(--copper-bright); border:1px solid var(--copper); padding:10px 16px; font-family:var(--mono); font-size:12px; letter-spacing:0.05em; border-radius:2px;}

  #editView{display:none; max-width:720px; margin:0 auto; padding:100px 32px 80px; position:relative; z-index:1;}
  .edit-title{font-family:var(--serif); font-weight:700; font-size:30px; color:var(--paper); margin-bottom:8px;}
  .edit-hint{font-family:var(--sans); font-size:13px; color:var(--chalk); opacity:0.75; margin-bottom:30px;}
  .edit-hint code{background:var(--navy-deep); padding:1px 6px; border-radius:3px; font-family:var(--mono);}
  .field{margin-bottom:18px;}
  .field-label{font-family:var(--mono); font-size:11.5px; color:var(--copper-bright); letter-spacing:0.06em; margin-bottom:6px; text-transform:uppercase;}
  .field input, .field textarea{width:100%; background:transparent; border:1px solid var(--blue-line); color:var(--paper); padding:10px 12px; font-size:14.5px; font-family:var(--sans);}
  .field textarea{font-size:14px; line-height:1.6; resize:vertical;}
  .save-btn{padding:12px 26px; font-size:13px;}
  #saveMsg{color:var(--copper-bright); font-family:var(--mono); font-size:12px; margin-left:12px;}
  #loadingScreen{min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:13px; letter-spacing:0.1em; opacity:0.6;}

  @media (max-width:600px){
    .hero-inner{padding:36px 20px;}
    .title-block{max-width:100%;}
    .section{padding:56px 0;}
    footer{flex-direction:column; align-items:flex-start;}
  }
</style>
</head>
<body>

<div class="grid-bg"></div>
<div id="loadingScreen">불러오는 중…</div>
<button class="edit-fab" id="editToggleBtn" style="display:none;">✎ 편집</button>
<main class="wrap" id="viewMode" style="display:none;"></main>
<div id="editView"></div>

<script>
const STORAGE_KEY = "profile-content-v1";
const EDIT_PIN = "0000";

  education: [

  qrUrl: ""

let content = JSON.parse(JSON.stringify(DEFAULT_CONTENT));

function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toLines(arr, fmt){ return arr.map(fmt).join("\n"); }
function parseTimeline(text){
  return text.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{
    const idx = l.indexOf("|");
    if(idx === -1) return {period:"", title:l.trim()};
    return {period:l.slice(0,idx).trim(), title:l.slice(idx+1).trim()};
  });
}
function parsePoints(text){ return text.split("\n").map(l=>l.trim()).filter(Boolean); }
function parseFeatures(text){
  return text.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{
    const parts = l.split("|").map(p=>p.trim());
    return {tag:parts[0]||"", title:parts[1]||"", desc:parts[2]||""};
  });
}

function timelineHTML(items, accent){
  return '<div class="timeline">' + items.map(it =>
    `<div class="timeline-row">
      <div class="timeline-period">${esc(it.period)}</div>
      <div class="timeline-divider"></div>
      <div class="timeline-title${accent?' accent':''}">${esc(it.title)}</div>
    </div>`
  ).join("") + '</div>';
}

function renderView(){
  const c = content;
  const schoolShort = c.school.split("·")[0].trim().toUpperCase();
  document.getElementById("viewMode").innerHTML = `
    <section class="hero">
      <div class="hero-inner">
        <span class="crosshair tl"></span><span class="crosshair tr"></span>

        <div class="hero-flex">
          <div class="hero-text">

function initReveal(){
  const els = document.querySelectorAll(".reveal");
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(e => { if(e.isIntersecting) e.target.classList.add("in"); });
  }, {threshold:0.12});
  els.forEach(el => io.observe(el));
}

let robotListenersAttached = false;
function initRobot(){
  const wrap = document.getElementById("robotWrap");
  const group = document.getElementById("robotGroup");
  const pupilL = document.getElementById("pupilL");
  const pupilR = document.getElementById("pupilR");
  const glintL = document.getElementById("glintL");
  const glintR = document.getElementById("glintR");
  if(!wrap) return;

  function update(clientX, clientY){
    const rect = wrap.getBoundingClientRect();
    if(!rect.width) return;
    const scale = rect.width / 220;
    const localX = (clientX - rect.left) / scale;
    const localY = (clientY - rect.top) / scale;

    function offsetFor(eyeX, eyeY){
      const dx = localX - eyeX, dy = localY - eyeY;
      const dist = Math.min(4.5, Math.hypot(dx,dy)/14);
      const angle = Math.atan2(dy,dx);
      return {x: Math.cos(angle)*dist, y: Math.sin(angle)*dist};
    }
    const l = offsetFor(83,84), r = offsetFor(137,84);
    if(pupilL){ pupilL.setAttribute("cx", 83+l.x); pupilL.setAttribute("cy", 84+l.y); }
    if(pupilR){ pupilR.setAttribute("cx", 137+r.x); pupilR.setAttribute("cy", 84+r.y); }
    if(glintL){ glintL.setAttribute("cx", 81+l.x); glintL.setAttribute("cy", 82+l.y); }
    if(glintR){ glintR.setAttribute("cx", 135+r.x); glintR.setAttribute("cy", 82+r.y); }

    const centerX = rect.left + rect.width/2;
    const deg = Math.max(-9, Math.min(9, (clientX - centerX)/34));
    if(group) group.style.transform = `rotate(${deg}deg)`;
  }

  if(!robotListenersAttached){
    window.addEventListener("mousemove", e => update(e.clientX, e.clientY), {passive:true});
    window.addEventListener("touchmove", e => { if(e.touches[0]) update(e.touches[0].clientX, e.touches[0].clientY); }, {passive:true});
    robotListenersAttached = true;
  }

  const eyesOpen = document.getElementById("eyesOpen");
  const eyesClosed = document.getElementById("eyesClosed");
  setInterval(() => {
    if(!eyesOpen || !eyesClosed) return;
    eyesOpen.style.display = "none"; eyesClosed.style.display = "block";
    setTimeout(() => { eyesOpen.style.display = "block"; eyesClosed.style.display = "none"; }, 140);
  }, 3600);
}

    <h2 class="edit-title">내용 편집</h2>

    <div class="field"><div class="field-label">한 줄 소개(부제)</div><input id="f_role" value="${esc(c.role)}"></div>
    <div class="field"><div class="field-label">소속</div><input id="f_school" value="${esc(c.school)}"></div>
    <div class="field"><div class="field-label">자기소개</div><textarea id="f_bio" rows="4">${esc(c.bio)}</textarea></div>

    <div class="field"><div class="field-label">학력 (기간 | 내용)</div><textarea id="f_edu" rows="4">${esc(toLines(c.education, e=>e.period+" | "+e.title))}</textarea></div>

    <div class="field"><div class="field-label">활동·집필 (기간 | 내용)</div><textarea id="f_act" rows="3">${esc(toLines(c.activities, e=>e.period+" | "+e.title))}</textarea></div>

    <div class="field"><div class="field-label">원고 - 발행처/구분</div><input id="f_mk" value="${esc(c.manuscript.kicker)}"></div>
    <div class="field"><div class="field-label">원고 - 제목 (줄바꿈 가능)</div><textarea id="f_mt" rows="2">${esc(c.manuscript.title)}</textarea></div>
    <div class="field"><div class="field-label">원고 - 설명</div><textarea id="f_md" rows="4">${esc(c.manuscript.desc)}</textarea></div>
    <div class="field"><div class="field-label">원고 - 핵심 주장 (한 줄에 하나씩)</div><textarea id="f_mp" rows="3">${esc(toLines(c.manuscript.points, p=>p))}</textarea></div>

    <div class="field"><div class="field-label">프로젝트 - 설명</div><textarea id="f_ad" rows="3">${esc(c.appProject.desc)}</textarea></div>
    <div class="field"><div class="field-label">프로젝트 - 기능 (구분 | 제목 | 설명)</div><textarea id="f_af" rows="5">${esc(toLines(c.appProject.features, f=>f.tag+" | "+f.title+" | "+f.desc))}</textarea></div>

    <div style="display:flex; gap:12px; align-items:center; margin-top:24px;">
      <button class="save-btn" id="saveBtn">저장하기</button>
      <span id="saveMsg"></span>
    </div>
  `;
  document.getElementById("saveBtn").onclick = saveEdit;
}

async function saveEdit(){
  const btn = document.getElementById("saveBtn");
  const msg = document.getElementById("saveMsg");
  btn.disabled = true; btn.textContent = "저장 중…";
  const next = {
    name: document.getElementById("f_name").value,
    role: document.getElementById("f_role").value,
    school: document.getElementById("f_school").value,
    bio: document.getElementById("f_bio").value,
    education: parseTimeline(document.getElementById("f_edu").value),
    career: parseTimeline(document.getElementById("f_career").value),
    activities: parseTimeline(document.getElementById("f_act").value),
    manuscript: {
      kicker: document.getElementById("f_mk").value,
      title: document.getElementById("f_mt").value,
      desc: document.getElementById("f_md").value,
      points: parsePoints(document.getElementById("f_mp").value)
    },
    appProject: {
      desc: document.getElementById("f_ad").value,
      features: parseFeatures(document.getElementById("f_af").value)
    },
    qrUrl: content.qrUrl
  };
  try{
    const res = await window.storage.set(STORAGE_KEY, JSON.stringify(next), true);
    if(res){
      content = next;
      closeEditView();
    } else {
      msg.textContent = "저장에 실패했습니다. 다시 시도해주세요.";
    }
  }catch(e){
    msg.textContent = "저장 중 오류가 발생했습니다.";
  }finally{
    btn.disabled = false; btn.textContent = "저장하기";
  }
}

function closeEditView(){
  document.getElementById("editView").style.display = "none";
  document.getElementById("viewMode").style.display = "block";
  renderView();
}

document.getElementById("editToggleBtn").onclick = () => {
  const editing = document.getElementById("editView").style.display === "block";
  if(editing){
    closeEditView();
  } else {
    const pin = window.prompt("편집 PIN을 입력하세요");
    if(pin !== EDIT_PIN){
      if(pin !== null) alert("PIN이 올바르지 않습니다.");
      return;
    }
    openEditView();
    document.getElementById("editToggleBtn").textContent = "닫기";
  }
};

(async function init(){
  try{
    const res = await window.storage.get(STORAGE_KEY, true);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      content = Object.assign({}, DEFAULT_CONTENT, parsed);
    }
  }catch(e){
    // no saved content yet — use defaults
  }
  document.getElementById("loadingScreen").style.display = "none";
  document.getElementById("editToggleBtn").style.display = "block";
  document.getElementById("viewMode").style.display = "block";
  renderView();
})();
</script>
